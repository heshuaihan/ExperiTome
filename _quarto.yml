website:
  site-url: https://heshuaihan.github.io/ExperiTome/
  title: ExperiTome
  search: true
  navbar:
    logo: assets/experitome-logo-v1.png
    logo-alt: ExperiTome
    left:
      - text: Protocols
        href: protocols/index.qmd
      - text: Data
        href: data/index.qmd
      - text: Analysis
        href: analysis/index.qmd
      - text: Resources
        href: materials/index.qmd
      - text: About
        href: about.qmd
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - index.qmd
      - protocols/index.qmd
      - analysis/index.qmd
      - data/index.qmd
      - section: 实验路线
        contents:
          - protocols/worm/PROT-WORM-001_线虫蛋白质质谱样品制备.qmd
          - protocols/turboid/PROT-TURBOID-001_TurboID链霉亲和素富集质谱.qmd
      - section: 操作模块
        contents:
          - protocols/modules/MOD-TURBOID-002_TurboID标记与验证.qmd
          - protocols/modules/MOD-WORM-001_线虫收集与裂解.qmd
          - protocols/modules/MOD-PROT-001_蛋白定量与留样.qmd
          - protocols/modules/MOD-TURBOID-001_链霉亲和素富集.qmd
          - protocols/modules/MOD-PROT-002_蛋白沉淀.qmd
          - protocols/modules/MOD-PROT-003_胰酶消化.qmd
          - protocols/modules/MOD-PROT-004_C18-StageTip脱盐.qmd
          - protocols/modules/MOD-PROT-005_肽段定量与上样.qmd
      - section: 配套资料
        contents:
          - materials/index.qmd
          - materials/buffers/index.qmd
          - instruments/index.qmd
          - standards/index.qmd
          - sources/index.qmd
          - about.qmd
          - roadmap.qmd
          - licensing/index.qmd
      - section: 版本与维护
        contents:
          - maintenance/index.qmd
          - review/versions/index.qmd
          - review/readiness.qmd
          - review/index.qmd
  page-footer:
    left: "ExperiTome · Shuaihan He"
    right:
      - text: "Content: CC BY 4.0 · Code: MIT"
        href: licensing/index.qmd
format:
  html:
    theme:
      - cosmo
      - assets/protocol.scss
    include-after-body: assets/protocol-footer.html
    toc: true
    toc-title: 本页导航
    toc-depth: 2
    lang: zh
    link-external-newwindow: true
    callout-appearance: simple
    callout-icon: false
    smooth-scroll: true
    anchor-sections: true
    grid:
      sidebar-width: 220px
      body-width: 820px
      margin-width: 180px
      gutter-width: 24px
